name: Deploy governance baseline
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [what-if, apply]
        default: what-if
        required: true
      effect:
        type: choice
        options: [Audit, Deny]
        default: Audit
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: governance-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.effect == 'Deny' && 'governance-enforce' || 'governance-audit' }}
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      LOCATION: ${{ vars.LOCATION || 'eastus' }}
      OPERATION: ${{ inputs.operation }}
      EFFECT: ${{ inputs.effect }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Preview or deploy requested effect
        run: bash scripts/deploy.sh "$OPERATION" "$EFFECT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-deployment-templates
          path: build/
          retention-days: 1
